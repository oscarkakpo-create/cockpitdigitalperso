async function sample(){if(!current)return;if((current.source||current.output||current.questions.length)&&!confirm('Charger un exemple remplacera le contenu de travail de ce projet. Continuer ?'))return;const p=current;p.sample=true;p.subject='Pédagogie universitaire';p.objective='Formuler un objectif observable et proposer un feedback utile.';p.source='Un objectif pédagogique décrit une action observable de l’étudiant. Comparer deux solutions et justifier un choix produit une trace exploitable. Un feedback formatif s’appuie sur une observation de la production et indique une prochaine étape réalisable. Il ne porte pas un jugement définitif sur la personne.';p.sourceName='Exemple intégré LE PROF · démonstration';p.sourceHash='';p.output='';p.questions=[];p.audit=null;if(p.kind==='gift'){p.questions=C.sampleQuestions();p.config.count=2;}if(p.kind==='h5p'){if(!p.h5p.format)p.h5p.format='drag';p.h5p.content=D.formats.find(f=>f.id===p.h5p.format).example;}if(p.kind==='grades')p.grades.csv='identifiant;cc;examen\nE001;14;12\nE002;9,5;11\nE003;ABS;15\nE004;0;10\nE005;18;\nE006;22;14';if(p.kind==='calendar'){p.event.title='Relecture des projets · exemple';p.event.date=new Date(Date.now()+7*86400000).toISOString().slice(0,10);p.event.description='Examiner les objectifs, les productions et les critères.';}if(p.kind==='message'){p.message.action='déposer votre analyse dans l’espace de cours';p.message.deadline='[date à compléter]';}if(p.kind==='feedback')p.feedback={strength:'Vous repérez les deux hypothèses pertinentes.',observation:'Le lien entre les données et la conclusion n’est pas explicité.',next:'Reprenez le paragraphe de conclusion en citant une donnée qui appuie chaque hypothèse.'};dirty();save();render();toast('Exemple chargé. Il reste distinct de vos documents.');}

// Imports et sauvegardes : lecture locale, aucune transmission implicite.
async function importContent(file){if(!file||!current)return;const p=current;try{toast('Lecture locale du fichier…');const result=await I.text(file);if(p.kind==='grades'){p.grades.csv=result.text.slice(0,160000);}else{p.source=result.text.slice(0,160000);p.sourceName=file.name;p.sourceHash=result.sha256||'';p.sample=false;if(result.slides&&p.taskId==='ppt-h5p'){p.h5p.format='presentation';p.h5p.content=result.slides.map(s=>[s.title||'Diapositive '+s.number,(s.body||s.text||'').replace(/\s+/g,' ').replace(/\|/g,'/'),s.hidden?'Masquée dans le support : décider de sa publication':'Interaction à concevoir'].map(x=>String(x).replace(/\|/g,'/')).join('|')).join('\n');}}
 p.sample=false;p.review={faithful:false,pedagogy:false};p.updatedAt=new Date().toISOString();save();if(current?.id===p.id)render();const warnings=[...(result.warnings||[])];if(result.text.length>160000)warnings.push('Le texte de travail a été limité à 160 000 caractères. Conservez et examinez le document original.');if(warnings.length)openModal('Fichier lu · limites à examiner',notice('Aucun fichier n’a quitté ce navigateur.')+`<p><strong>${e(file.name)}</strong></p>`+warnings.map(w=>notice(e(w),'warn')).join(''),btn('Continuer','close-modal','primary'));else toast('Contenu importé localement.');}catch(err){toast(err.message,true);}}
async function importMBZ(file){if(!file||!current)return;const p=current;try{toast('Inventaire local de l’archive…');const report=await I.mbz(file);p.audit=report;p.sample=false;p.review={faithful:false,pedagogy:false};p.updatedAt=new Date().toISOString();p.step=1;save();if(current?.id===p.id)render();toast('Inventaire terminé. L’archive originale n’a pas été modifiée.');}catch(err){toast(err.message,true);}}
async function importSources(fileList){let added=0;for(const file of Array.from(fileList).slice(0,30)){try{if(db.sources.length>=30)throw new Error('Limite de 30 sources atteinte. Exportez ou retirez une référence.');const r=await I.text(file);if(r.text.length>250000)throw new Error(file.name+' : texte trop volumineux pour le registre (250 000 caractères).');const expected=D.expectedSources.find(s=>C.normalize(s.name)===C.normalize(file.name));const entry={id:C.uid(),name:file.name,text:r.text,raw:typeof r.raw==='string'?r.raw:'',sha256:r.sha256||'',family:expected?.family||'reference',version:expected?.version||1,approved:false,date:new Date().toISOString()};const idx=db.sources.findIndex(x=>C.normalize(x.name)===C.normalize(file.name));if(idx>=0){if(!confirm('Remplacer la source « '+file.name+' » dans le registre ? Son approbation sera retirée.'))continue;db.sources[idx]=entry;}else db.sources.push(entry);added++;}catch(err){toast(err.message,true);}}save();nav('sources');render();toast(added+' source(s) importée(s). Examinez-les avant approbation.');}
function reviewSource(id){const s=db.sources.find(x=>x.id===id);if(!s)return;modalState={sourceId:id,text:s.text};const families=[['reference','Référence générale'],['gift','GIFT'],['quiz','H5P · quiz'],['drag','H5P · texte à compléter'],['mark','H5P · identification'],['summary','H5P · synthèse'],['timeline','H5P · chronologie'],['presentation','H5P · présentation'],['universal','H5P Universel · référence séparée'],['mbz','Moodle · MBZ']];openModal('Examiner une référence',`<p><strong>${e(s.name)}</strong></p><p class="small muted">SHA-256 : ${e(s.sha256||'indisponible')}</p><div class="form-grid"><div class="field"><label for="source-family">Famille méthodologique</label><select id="source-family">${families.map(([v,l])=>`<option value="${v}" ${s.family===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label for="source-version">Version</label><input id="source-version" type="number" min="0" max="100" step="0.1" value="${Number(s.version)||1}"></div></div><textarea class="modal-textarea" readonly>${e(s.text)}</textarea><div class="check-row"><input type="checkbox" id="source-approved" ${s.approved?'checked':''}><label for="source-approved">J’ai examiné ce texte et j’autorise son utilisation comme référence.<span>Les données utilisateur restent distinctes de cette référence.</span></label></div>`,btn('Retirer du registre','source-delete','danger','trash')+btn('Enregistrer la décision','source-save','primary','check'),true);}
function search(query){currentResults=C.searchTasks(query,D.tasks).slice(0,6);const node=$('#search-results');if(!node)return;searchIndex=-1;$('#task-search').setAttribute('aria-expanded','true');node.hidden=false;node.classList.remove('hidden');node.innerHTML=query.trim()?currentResults.map((t,i)=>`<button id="suggestion-${i}" role="option" aria-selected="false" data-a="start" data-task="${t.id}"><span class="task-glyph">${icon(studioIcon(t.studio),17)}</span><span><strong>${e(t.title)}</strong><small>${e(t.desc)}</small></span>${icon('arrow',15)}</button>`).join('')+`<div class="search-caption">Suggestions par mots-clés · choisissez le parcours qui correspond à votre besoin.</div>`:D.tasks.filter(t=>['gift','ppt-h5p','examen','mail'].includes(t.id)).map(t=>`<button role="option" data-a="start" data-task="${t.id}">${icon(studioIcon(t.studio),17)} <strong>${e(t.title)}</strong></button>`).join('');if(query.trim()&&!currentResults.length)node.innerHTML=`<div class="search-caption">Aucun raccourci précis. Explorez un studio ci-dessous.</div>`;}
function closeSearch(){const n=$('#search-results');if(n){n.hidden=true;n.classList.add('hidden');}$('#task-search')?.setAttribute('aria-expanded','false');$('#task-search')?.removeAttribute('aria-activedescendant');}
function exportProduction(action){if(!current)return;const p=current,name=C.slug(p.title)||'le-prof';if(action==='project-json'){download(name+'.leprof.json',JSON.stringify({schema:'leprof.project.v1',project:p},null,2),'application/json;charset=utf-8');return;}if(action==='export-prompt'){download(name+'-prompt.txt',C.makePrompt(p,taskOf(),D,db.sources));return;}if(!canExport(p))throw new Error('Terminez les contrôles et les deux validations de relecture.');
 if(action==='export-gift'||action==='export-gift-txt')download(name+(action==='export-gift'?'.gift':'.txt'),C.gift(p.questions,p.title));
 else if(action==='export-questions')download(name+'.questions.json',JSON.stringify({schema:'leprof.questions.v1',questions:p.questions},null,2),'application/json;charset=utf-8');
 else if(action==='export-blueprint')download(name+'.h5p-blueprint.json',JSON.stringify(C.blueprint(p,D),null,2),'application/json;charset=utf-8');
 else if(action==='export-audit')download(name+'.mbz-inventory.json',JSON.stringify(p.audit,null,2),'application/json;charset=utf-8');
 else if(action==='export-grades')download(name+'.csv',C.gradesCSV(C.gradebook(p.grades.csv,p.grades.cc,p.grades.exam,p.grades.threshold)),'text/csv;charset=utf-8');
 else if(action==='export-ics')download(name+'.ics',C.ics(p.event),'text/calendar;charset=utf-8');
 else if(action==='export-rubric')download(name+'.md',rubricText(p),'text/markdown;charset=utf-8');
 else if(action==='export-html')download(name+'.html','<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+e(p.title)+'</title><style>body{font:17px/1.7 system-ui,sans-serif;max-width:850px;padding:40px 22px;margin:auto;color:#243c30}h1,h2,h3{line-height:1.3}p{white-space:pre-wrap}.doc-label{font-size:12px}footer{border-top:1px solid #ddd;margin-top:40px;padding-top:16px;font-size:12px}</style><main>'+renderDoc(p.output)+'</main><footer>LE PROF · Ressource relue par son auteur. Vérifiez les droits d’usage avant diffusion.</footer></html>','text/html;charset=utf-8');
 else download(name+(action==='export-md'?'.md':'.txt'),p.output,action==='export-md'?'text/markdown;charset=utf-8':'text/plain;charset=utf-8');}
function testGift(){let right=0;current.questions.forEach((q,i)=>{const selections=$$(`input[name="gift-preview-${i}"]:checked`).map(x=>Number(x.value));const expected=q.answers.map((a,j)=>a.correct?j:-1).filter(j=>j>=0);if(expected.length===selections.length&&expected.every(j=>selections.includes(j)))right++;});const node=$('#simulation-result');if(node)node.innerHTML=notice(`${right} / ${current.questions.length} réponse(s) entièrement juste(s). Simulation locale, sans enregistrement de note étudiante.`)+(current.questions.map(q=>`<p class="small spaced-top"><strong>${e(q.title)}</strong> · ${e(q.generalFeedback||'Feedback général non renseigné.')}</p>`).join(''));}
function testH5p(){const p=current,f=p.h5p.format;let correct=0,total=0,extra=0;if(f==='drag'){const expected=C.markedTokens(p.h5p.content).filter(t=>t.answer).map(t=>t.text);total=expected.length;$$('[data-hole]').forEach((n,i)=>{if(n.value===expected[i])correct++;});}else if(f==='mark'){total=$$('[data-word][data-correct="true"]').length;$$('[data-word][aria-pressed="true"]').forEach(n=>n.dataset.correct==='true'?correct++:extra++);}else if(['quiz','summary'].includes(f)){const rows=C.h5pRows(p);total=rows.length;rows.forEach((r,i)=>{if($(`input[name="h5p-preview-${i}"]:checked`)?.value==='0')correct++;});}const n=$('#simulation-result');if(n)n.innerHTML=notice(`${correct} / ${total} élément(s) juste(s)${extra?' · '+extra+' sélection(s) incorrecte(s)':''}. Simulation pédagogique, pas le lecteur H5P officiel.`)+(p.h5p.feedback?'<p class="small spaced-top">Reprenez le passage concerné dans votre source et examinez pourquoi chaque choix est défendable ou non.</p>':'');}
function aiHelp(){openModal('Deux façons de travailler avec votre IA',`<h3>Sans connexion dans LE PROF</h3><p>Le bouton « Préparer ma demande IA » compose un prompt complet. Copiez-le dans votre outil autorisé, puis collez la réponse dans la zone de production. Pour les QCM, utilisez l’import de questions JSON.</p><h3 class="spaced-top">Avec le serveur fourni</h3><p>Configurez un fournisseur compatible côté serveur. Le bouton IA présente le texte transmis avant chaque envoi. Aucun secret n’est conservé dans le navigateur.</p>${notice('Les éditeurs, simulations et trames locales ne sont pas des réponses générées par une IA. Les modèles peuvent se tromper : toute production doit être examinée.','warn')}`,btn('Fermer','close-modal')+btn('Préférences','settings','primary','settings'));}
async function checkServer(show=false){if(!/^https?:$/.test(location.protocol)){server={enabled:false};if(show)toast('Version HTML locale : démarrez le serveur fourni pour activer une connexion IA.');return;}try{const r=await fetch('/api/status',{signal:AbortSignal.timeout(4000),cache:'no-store'});if(!r.ok)throw new Error();const s=await r.json();server={enabled:s.enabled===true,model:typeof s.model==='string'?s.model:'',provider:typeof s.provider==='string'?s.provider:''};if(show)toast(server.enabled?'Serveur configuré. Le fournisseur sera contacté uniquement après confirmation.':'Serveur local actif ; aucun fournisseur IA configuré.');}catch{server={enabled:false};if(show)toast('Aucun serveur IA LE PROF détecté. Le mode local reste disponible.');}if(location.hash==='#/settings')render();}
function requestAI(){if(!current)return;if(!server.enabled){aiHelp();return;}const p=current;modalState={projectId:p.id,text:C.makePrompt(p,taskOf(),D,db.sources)};openModal('Examiner et autoriser cet envoi',`<p>Destinataire : <strong>${e(server.provider)}</strong> · modèle <strong>${e(server.model)}</strong></p>${notice('Le texte ci-dessous quittera votre appareil. Il inclut votre contenu de travail et, le cas échéant, une référence approuvée. Retirez les données personnelles et confidentielles.','warn')}<textarea id="ai-request" class="modal-textarea">${e(modalState.text)}</textarea><div class="check-row"><input type="checkbox" id="ai-consent"><label for="ai-consent">J’autorise cet envoi au fournisseur affiché.</label></div><div id="ai-status" role="status"></div>`,btn('Annuler','close-modal')+btn('Envoyer et générer','ai-confirm','primary','spark'),true);}
async function runAI(button){if(!$('#ai-consent')?.checked)throw new Error('Confirmez l’autorisation d’envoi.');const p=db.projects.find(x=>x.id===modalState.projectId);if(!p)throw new Error('Projet introuvable.');const prompt=$('#ai-request').value;button.disabled=true;button.textContent='Génération en cours…';const status=$('#ai-status');try{const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,kind:p.kind,consent:true}),signal:AbortSignal.timeout(100000)});const data=await r.json();if(!r.ok||typeof data.text!=='string')throw new Error(data.error||'Le serveur n’a pas renvoyé de texte exploitable.');if(p.kind==='gift'){let qs;try{qs=C.importQuestions(data.text);}catch{modalState={text:data.text};openModal('Réponse reçue · import JSON à corriger',notice('La réponse n’a pas remplacé vos questions car sa structure JSON est incompatible.','warn')+`<textarea class="modal-textarea" readonly>${e(data.text)}</textarea>`,btn('Copier la réponse','modal-copy','primary','copy')+btn('Fermer','close-modal'),true);return;}p.questions=qs;p.step=1;}else if(p.kind==='h5p'){modalState={text:data.text};openModal('Réponse IA à examiner',notice('Aucun paquet H5P n’est certifié par cette réponse. Reprenez le contenu utile dans l’éditeur du format choisi.','warn')+`<textarea class="modal-textarea" readonly>${e(data.text)}</textarea>`,btn('Exporter la réponse','modal-download','','download')+btn('Copier','modal-copy','primary','copy'),true);return;}else{if(p.output)p.history.unshift({id:C.uid(),date:new Date().toISOString(),label:'Avant réponse IA',output:p.output});p.history=p.history.slice(0,6);p.output=data.text.slice(0,160000);p.step=1;}p.review={faithful:false,pedagogy:false};p.updatedAt=new Date().toISOString();save();closeModal();nav('project/'+p.id);render();toast('Réponse IA reçue. La relecture pédagogique reste à faire.');}catch(err){if(status?.isConnected)status.innerHTML=notice(e(err.message),'error');else toast(err.message,true);}finally{if(button.isConnected){button.disabled=false;button.textContent='Envoyer et générer';}}}
function showHistory(){if(!current)return;openModal('Versions de votre texte',current.history.length?current.history.map((h,i)=>`<section class="card spaced-top"><p><strong>${e(h.label)}</strong> · ${e(relative(h.date))}</p><pre class="code-box">${e(h.output.slice(0,800))}${h.output.length>800?'…':''}</pre>${btn('Restaurer ce texte','history-restore','small','history',`data-index="${i}"`)}</section>`).join(''):notice('Les textes sont conservés avant une nouvelle trame ou une réponse IA. L’édition manuelle ne crée pas automatiquement une version.'),btn('Fermer','close-modal'),true);}
async function restoreBackup(file){if(!file)return;if(file.size>8*1024*1024)throw new Error('Sauvegarde trop volumineuse (8 Mo maximum).');const raw=JSON.parse(await file.text());if(raw.schema==='leprof.project.v1'){const p=safeCloneProject(raw.project);if(!p)throw new Error('Projet non reconnu.');p.id=C.uid();p.title+=' · import';p.review={faithful:false,pedagogy:false};p.updatedAt=new Date().toISOString();db.projects.unshift(p);save();nav('project/'+p.id);toast('Projet importé. Sa relecture doit être renouvelée.');return;}if(raw.schema!==1||!Array.isArray(raw.projects))throw new Error('Sauvegarde LE PROF non reconnue.');if(!confirm('Fusionner cette sauvegarde avec votre espace ? Les projets seront ajoutés comme copies, sans effacer les projets existants.'))return;const added=raw.projects.slice(0,150).map(safeCloneProject).filter(Boolean);for(const p of added){p.id=C.uid();p.review={faithful:false,pedagogy:false};}if(db.projects.length+added.length>150)throw new Error('La fusion dépasserait 150 projets. Exportez puis retirez des projets avant de recommencer.');db.projects.unshift(...added);if(Array.isArray(raw.sources))for(const s of raw.sources.slice(0,30)){if(db.sources.length>=30)break;if(typeof s.text==='string'&&s.text.length<=250000&&typeof s.name==='string'&&!db.sources.some(x=>x.name===s.name&&x.sha256===s.sha256))db.sources.push({id:C.uid(),name:s.name.slice(0,200),family:String(s.family||'reference'),version:Number(s.version)||1,text:s.text,raw:typeof s.raw==='string'?s.raw.slice(0,400000):'',sha256:String(s.sha256||''),date:new Date().toISOString(),approved:false});}save();nav('projects');toast(added.length+' projet(s) ajouté(s). Réexaminez les sources avant approbation.');}

// Un point d’entrée pour chaque action visible.
async function action(name,node){if(node?.disabled)return;const p=current;
 if(name.startsWith('export-')||name==='project-json'){exportProduction(name);return;}
 switch(name){
 case 'new':openNew();break;
 case 'start':start(node.dataset.task);break;
 case 'derive':{if(!p)return;if(db.projects.length>=150)throw new Error('Limite de 150 projets.');const task=D.tasks.find(t=>t.id===node.dataset.task);if(!task)return;const derived=C.newProject(task);for(const k of ['source','sourceName','sourceHash','subject','level','objective','sample'])if(p[k]!==undefined)derived[k]=p[k];derived.config={...p.config};db.projects.unshift(derived);save();nav('project/'+derived.id);toast('Nouveau projet créé à partir de la même source.');break;}
 case 'all-tasks':closeModal();nav('tasks');break;
 case 'menu':document.body.classList.add('menu-open');break;
 case 'close-menu':document.body.classList.remove('menu-open');break;
 case 'projects':closeModal();nav('projects');break;
 case 'settings':closeModal();nav('settings');break;
 case 'time':db.settings.time=Number(node.dataset.time);save();render();break;
 case 'search':if($('#task-search')?.value.trim()){search($('#task-search').value);$('#search-results button')?.focus();}else $('#task-search')?.focus();break;
 case 'search-example':$('#task-search').value=node.dataset.query||node.textContent.trim();search($('#task-search').value);$('#task-search').focus();break;
 case 'sample':await sample();break;
 case 'step':case 'next':case 'previous':if(!p)return;{const next=name==='step'?Number(node.dataset.step):p.step+(name==='next'?1:-1);if(next===1&&p.kind==='h5p'&&!p.h5p.format)throw new Error('Choisissez d’abord ce que les étudiants doivent faire.');p.step=Math.max(0,Math.min(3,next));save();render();window.scrollTo({top:0,behavior:'smooth'});}break;
 case 'import-content':$('#content-file').click();break;
 case 'import-mbz':$('#mbz-file').click();break;
 case 'import-sources':$('#registry-file').click();break;
 case 'source-review':reviewSource(node.dataset.id);break;
 case 'source-save':{const s=db.sources.find(x=>x.id===modalState.sourceId);if(!s)return;s.family=$('#source-family').value;s.version=Math.max(0,Math.min(100,Number($('#source-version').value)||1));s.approved=$('#source-approved').checked;save();closeModal();render();toast('Décision enregistrée.');break;}
 case 'source-delete':if(confirm('Retirer cette source du registre local ? Son fichier original ne sera pas supprimé.')){db.sources=db.sources.filter(x=>x.id!==modalState.sourceId);save();closeModal();render();}break;
 case 'format':if(!p)return;if(p.h5p.format!==node.dataset.format&&p.h5p.content&&!confirm('Changer de format et vider son contenu ? Le texte source sera conservé.'))return;p.h5p.format=node.dataset.format;p.h5p.content='';dirty();render();break;
 case 'h5p-example':{const f=D.formats.find(x=>x.id===p.h5p.format);if(f){if(p.h5p.content&&!confirm('Remplacer le contenu de l’activité par un exemple ?'))return;p.h5p.content=f.example;p.sample=true;dirty();render();}}break;
 case 'add-question':if(p.questions.length>=100)throw new Error('Maximum 100 questions par projet.');p.questions.push(C.blankQuestion(p.questions.length+1));dirty();render();break;
 case 'remove-question':if(confirm('Supprimer cette question ?')){p.questions.splice(Number(node.dataset.index),1);dirty();render();}break;
 case 'add-answer':{const q=p.questions[Number(node.dataset.index)];if(q.answers.length>=6)throw new Error('Maximum six propositions.');q.answers.push({text:'',correct:false,feedback:''});dirty();render();break;}
 case 'remove-answer':{const q=p.questions[Number(node.dataset.index)];if(q.answers.length<=2)throw new Error('Conservez au moins deux propositions.');q.answers.splice(Number(node.dataset.answer),1);dirty();render();break;}
 case 'import-questions':openModal('Importer des questions structurées',`<p>Collez la réponse JSON de votre IA, un tableau de questions ou un objet contenant « questions ». Les contenus existants ne seront remplacés qu’après lecture réussie.</p><textarea id="json-input" class="modal-textarea" placeholder='{"questions": [...]}'></textarea><details class="expert"><summary>Structure attendue</summary><pre class="code-box">${e(JSON.stringify(C.questionSchema,null,2))}</pre></details><div id="json-error"></div>`,btn('Annuler','close-modal')+btn('Lire et importer','questions-confirm','primary','upload'),true);break;
 case 'questions-confirm':try{const qs=C.importQuestions($('#json-input').value);p.questions=qs;p.sample=false;dirty();save();closeModal();render();toast(qs.length+' question(s) importée(s). Examinez les contrôles et les réponses.');}catch(err){$('#json-error').innerHTML=notice(e(err.message),'error');}break;
 case 'add-criterion':if(p.rubric.length>=20)throw new Error('Maximum vingt critères.');p.rubric.push({name:'Nouveau critère',descriptor:'',weight:0,score:''});dirty();render();break;
 case 'remove-criterion':if(p.rubric.length<=1)throw new Error('Conservez au moins un critère.');p.rubric.splice(Number(node.dataset.index),1);dirty();render();break;
 case 'draft':if(p.output&&!confirm('Créer une nouvelle trame ? Le texte précédent restera accessible dans les versions.'))return;snapshot('Avant nouvelle trame');p.output=p.kind==='mbz'?mbzPlan(p):C.draft(p,taskOf());dirty();save();render();toast('Trame locale créée. Complétez les passages à renseigner.');break;
 case 'copy-output':await copy(p.kind==='rubric'?rubricText(p):p.output||'');break;
 case 'preview':updatePreview();$('#live-preview')?.scrollIntoView({behavior:'smooth',block:'start'});break;
 case 'test-gift':testGift();break;
 case 'test-h5p':testH5p();break;
 case 'word':node.setAttribute('aria-pressed',node.getAttribute('aria-pressed')==='true'?'false':'true');node.classList.toggle('selected',node.getAttribute('aria-pressed')==='true');break;
 case 'prompt':openPrompt();break;
 case 'ai':requestAI();break;
 case 'ai-help':aiHelp();break;
 case 'check-server':await checkServer(true);break;
 case 'ai-confirm':await runAI(node);break;
 case 'history':showHistory();break;
 case 'history-restore':{const text=p.history[Number(node.dataset.index)]?.output;if(typeof text==='string'){snapshot('Avant restauration');p.output=text;dirty();closeModal();render();}}break;
 case 'duplicate':{const original=db.projects.find(x=>x.id===node.dataset.id);if(original){const clone=safeCloneProject(original);clone.id=C.uid();clone.title+=' · copie';clone.createdAt=clone.updatedAt=new Date().toISOString();clone.review={faithful:false,pedagogy:false};db.projects.unshift(clone);save();nav('project/'+clone.id);}}break;
 case 'delete-project':if(confirm('Supprimer ce projet de cet appareil ? Cette action n’affecte aucun fichier exporté.')){db.projects=db.projects.filter(x=>x.id!==node.dataset.id);save();render();}break;
 case 'backup':save();download('LE_PROF-sauvegarde-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db,null,2),'application/json;charset=utf-8');break;
 case 'restore':$('#backup-file').click();break;
 case 'clear-data':openModal('Effacer cet espace local',notice('Cette action supprime les projets, références et préférences conservés par LE PROF dans ce navigateur à cette adresse. Exportez une sauvegarde avant de continuer.','warn')+`<div class="field"><label for="delete-confirm">Saisissez SUPPRIMER</label><input id="delete-confirm" autocomplete="off"></div>`,btn('Annuler','close-modal')+btn('Effacer définitivement','clear-confirm','danger','trash'));break;
 case 'clear-confirm':if($('#delete-confirm').value!=='SUPPRIMER')throw new Error('Saisissez exactement SUPPRIMER pour confirmer.');db=defaults();save();closeModal();nav('home');render();toast('Espace local effacé.');break;
 case 'modal-copy':await copy(modalState.text||'');break;
 case 'modal-download':download('LE_PROF-demande.txt',modalState.text||'');break;
 case 'close-modal':closeModal();break;
 case 'help':openModal('Un poste de travail, pas un pilote automatique',`<h3>1. Partez de votre tâche.</h3><p>Les studios et la recherche par mots-clés vous orientent. Les formats techniques apparaissent ensuite.</p><h3 class="spaced-top">2. Travaillez dans l’éditeur.</h3><p>Vous pouvez saisir votre contenu, utiliser une trame locale, ou préparer une demande pour votre IA. Les exemples sont toujours signalés.</p><h3 class="spaced-top">3. Relisez, puis exportez.</h3><p>Les vérifications techniques ne remplacent ni votre expertise disciplinaire, ni votre décision pédagogique. Les deux validations humaines déverrouillent la production.</p>${notice('Cette V1 fonctionne localement. Aucun prompt CESAG absent n’est prétendu intégré. H5P : configuration et simulation uniquement. MBZ : inventaire en lecture seule.')}<p class="small muted">Raccourcis : Ctrl/⌘ K pour chercher · Échap pour fermer une fenêtre. Les imports d’archives sont limités à 15 Mo.</p>`,btn('Compris','close-modal','primary'));break;
 default:console.warn('Action inconnue',name);toast('Cette action n’est pas disponible.',true);
 }}

// Événements délégués : pas de script importé ni d’injection de HTML utilisateur.
document.addEventListener('click',ev=>{const link=ev.target.closest('[data-route]');if(link){ev.preventDefault();nav(link.dataset.route);return;}const node=ev.target.closest('[data-a]');if(node){ev.preventDefault();Promise.resolve(action(node.dataset.a,node)).catch(err=>toast(err.message,true));return;}if(ev.target.classList.contains('modal-backdrop'))closeModal();if(!ev.target.closest('.search-wrap'))closeSearch();if(ev.target.closest('.sidebar a'))document.body.classList.remove('menu-open');});
function updateInput(node){if(node.dataset.setting){db.settings[node.dataset.setting]=node.type==='checkbox'?node.checked:node.value.slice(0,70);scheduleSave();return;}if(!current)return;if(node.dataset.field){const path=node.dataset.field;setPath(current,path,node.type==='checkbox'?node.checked:node.type==='number'?Number(node.value):node.value);dirty(!path.startsWith('review.'));if(!path.startsWith('review.'))updatePreview();return;}if(node.dataset.q!==undefined){const q=current.questions[Number(node.dataset.q)];if(!q)return;if(node.dataset.answer!==undefined&&node.dataset.afield){const a=q.answers[Number(node.dataset.answer)];if(!a)return;if(node.dataset.afield==='correct'){if(q.type==='single')q.answers.forEach(x=>x.correct=false);a.correct=node.checked;}else a[node.dataset.afield]=node.value;}else if(node.dataset.qfield){q[node.dataset.qfield]=node.value;if(node.dataset.qfield==='type'&&q.type==='single'){let seen=false;q.answers.forEach(x=>{if(x.correct&&!seen)seen=true;else x.correct=false;});}}dirty();updatePreview();return;}if(node.dataset.rubric!==undefined){const r=current.rubric[Number(node.dataset.rubric)];if(!r)return;const f=node.dataset.rfield;r[f]=f==='score'?(node.value===''?'':Number(node.value)):f==='weight'?Number(node.value):node.value;dirty();updatePreview();}}
document.addEventListener('input',ev=>{if(ev.target.id==='task-search'){search(ev.target.value);return;}updateInput(ev.target);});
document.addEventListener('change',ev=>{const n=ev.target;if(n.type==='file')return;updateInput(n);if(n.dataset.field?.startsWith('review.')||n.dataset.qfield==='type'||n.dataset.afield==='correct'||n.dataset.rfield==='score'||n.dataset.rfield==='weight')render();});
document.addEventListener('keydown',ev=>{if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='k'){ev.preventDefault();if(!$('#task-search')){nav('home');setTimeout(()=>$('#task-search')?.focus(),80);}else $('#task-search').focus();}if(ev.key==='Escape'){closeModal();closeSearch();document.body.classList.remove('menu-open');}if($('.modal')&&ev.key==='Tab'){const focusable=$$('.modal button:not(:disabled),.modal input,.modal select,.modal textarea,.modal a[href]').filter(n=>n.offsetParent!==null),first=focusable[0],last=focusable.at(-1);if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last?.focus();}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first?.focus();}}if(ev.target.id==='task-search'){const options=$$('#search-results button');if(ev.key==='ArrowDown'||ev.key==='ArrowUp'){ev.preventDefault();if(!options.length)search(ev.target.value);searchIndex=Math.max(0,Math.min(options.length-1,searchIndex+(ev.key==='ArrowDown'?1:-1)));options.forEach((n,i)=>n.setAttribute('aria-selected',String(i===searchIndex)));if(options[searchIndex])ev.target.setAttribute('aria-activedescendant',options[searchIndex].id);}if(ev.key==='Enter'){ev.preventDefault();(options[Math.max(0,searchIndex)])?.click();}}});
$('#content-file').addEventListener('change',ev=>{importContent(ev.target.files[0]);ev.target.value='';});
$('#mbz-file').addEventListener('change',ev=>{importMBZ(ev.target.files[0]);ev.target.value='';});
$('#registry-file').addEventListener('change',ev=>{importSources(ev.target.files);ev.target.value='';});
$('#backup-file').addEventListener('change',ev=>{restoreBackup(ev.target.files[0]).catch(err=>toast('Import impossible : '+err.message,true));ev.target.value='';});
document.addEventListener('dragover',ev=>{const drop=ev.target.closest('[data-drop]');if(drop){ev.preventDefault();drop.classList.add('dragover');}});
document.addEventListener('dragleave',ev=>ev.target.closest('[data-drop]')?.classList.remove('dragover'));
document.addEventListener('drop',ev=>{const drop=ev.target.closest('[data-drop]');if(drop){ev.preventDefault();drop.classList.remove('dragover');const file=ev.dataTransfer.files[0];if(drop.dataset.drop==='mbz')importMBZ(file);else importContent(file);}});
window.addEventListener('hashchange',()=>{closeModal();document.body.classList.remove('menu-open');render();window.scrollTo(0,0);});window.addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save();});
render();checkServer(false);
})();
